name: Prepare MarketHub v17

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v17
        run: |
          rm -rf .github/workflows/prepare-v17.yml.tmp
          unzip -o MarketHub-Kenya-v17.zip -d extracted

          if [ -d "extracted/mh17" ]; then
            cp -a extracted/mh17/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f MarketHub-Kenya-v17.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prepare MarketHub Kenya v17 for deployment"
            git push
          fi
